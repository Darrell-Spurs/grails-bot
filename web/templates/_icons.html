{% macro icon(name, size=16, cls="", label=None, stroke=2) -%}
  {%- set d = LUCIDE.get(name) -%}
  {%- if d -%}
  <svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="{{ stroke }}"
       stroke-linecap="round" stroke-linejoin="round"
       {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true" focusable="false"{% endif %}
  >{{ d|safe }}</svg>
  {%- endif -%}
{%- endmacro %}
