{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Log in – Grails-Bot Admin{% endblock %}

{% block body %}
<div class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <span class="brand-mark brand-mark-lg">{{ icon("disc-3", size=26) }}</span>
      <h1>Grails-Bot Admin</h1>
    </div>

    <div class="panel panel-pad">
      {% if error %}
      <p class="notice" role="alert">{{ icon("circle-alert", size=15) }}{{ error }}</p>
      {% endif %}
      <form method="post">
        <div class="field">
          <label for="password">Admin password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" autofocus required>
        </div>
        <button type="submit" class="btn">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
